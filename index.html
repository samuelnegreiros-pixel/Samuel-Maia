<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel Maia</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:850px;
      background:#171717;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 0 40px rgba(0,0,0,0.5);
    }

    .hero{
      padding:80px 30px;
      text-align:center;
      background:linear-gradient(135deg,#1c1c1c,#252525);
    }

    .hero h1{
      font-size:52px;
      margin-bottom:10px;
    }

    .hero span{
      color:#8d8d8d;
      font-size:18px;
    }

    .hero p{
      margin-top:20px;
      color:#bdbdbd;
      line-height:1.6;
      font-size:18px;
    }

    .buttons{
      margin-top:35px;
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      padding:14px 30px;
      border-radius:14px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn-primary{
      background:white;
      color:black;
    }

    .btn-primary:hover{
      transform:translateY(-4px);
    }

    .btn-secondary{
      border:1px solid #444;
      color:white;
    }

    .btn-secondary:hover{
      background:#2b2b2b;
    }

    .section{
      padding:35px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#222;
      border-radius:18px;
      padding:25px;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      background:#2c2c2c;
    }

    .card h3{
      margin-bottom:10px;
      font-size:22px;
    }

    .card p{
      color:#bdbdbd;
      line-height:1.5;
    }

    footer{
      text-align:center;
      padding:20px;
      border-top:1px solid #2d2d2d;
      color:#777;
    }

    @media(max-width:600px){
      .hero h1{
        font-size:38px;
      }

      .hero p{
        font-size:16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <section class="hero">
      <h1>Samuel Maia</h1>
      <span>N° 36</span>

      <p>
        Tecnologia, criatividade e design moderno
        em um único projeto.
      </p>

      <div class="buttons">
        <a href="#" class="btn btn-primary">Entrar</a>
        <a href="#" class="btn btn-secondary">Contato</a>
      </div>
    </section>

    <section class="section">

      <div class="cards">

        <div class="card">
          <h3>Frontend</h3>
          <p>
            Sites modernos, rápidos
            e responsivos.
          </p>
        </div>

        <div class="card">
          <h3>UI Design</h3>
          <p>
            Interfaces minimalistas
            e elegantes.
          </p>
        </div>

        <div class="card">
          <h3>Projetos</h3>
          <p>
            Desenvolvimento de páginas
            e experiências digitais.
          </p>
        </div>

      </div>

    </section>

    <footer>
      © 2026 Samuel Maia
    </footer>

  </div>

</body>
</html>
